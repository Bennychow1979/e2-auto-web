name: Verify inventory permissions
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'portal.js', 'team.js', 'profile*.js', 'consultant.js', 'referral.js', 'partner*', 'referrals*', 'accept-invite.js', 'photo-sort.js', 'showroom.js', 'showroom-flow.js', 'car.js', 'car-save.js', 'saved*.js', 'customer*.js', 'loan*.js', 'document*.js', 'intake*.js', 'my-e2.js', 'e2-data.js', 'vehicle-seo.mjs', 'scripts/build-sitemap.mjs', 'scripts/build-languages.mjs', 'i18n.mjs', 'translations.mjs', 'vehicle-translations.mjs', 'vehicle-description.mjs', 'vehicle-translation*', 'portal.html', 'language-switcher.js', 'languages.css', 'car.html', 'index.html', 'showroom.html', 'robots.txt', 'package*.json', '.github/workflows/inventory-checks.yml']
  pull_request:
    paths: ['supabase/**', 'portal.js', 'team.js', 'profile*.js', 'consultant.js', 'referral.js', 'partner*', 'referrals*', 'accept-invite.js', 'photo-sort.js', 'showroom.js', 'showroom-flow.js', 'car.js', 'car-save.js', 'saved*.js', 'customer*.js', 'loan*.js', 'document*.js', 'intake*.js', 'my-e2.js', 'e2-data.js', 'vehicle-seo.mjs', 'scripts/build-sitemap.mjs', 'scripts/build-languages.mjs', 'i18n.mjs', 'translations.mjs', 'vehicle-translations.mjs', 'vehicle-description.mjs', 'vehicle-translation*', 'portal.html', 'language-switcher.js', 'languages.css', 'car.html', 'index.html', 'showroom.html', 'robots.txt', 'package*.json', '.github/workflows/inventory-checks.yml']
permissions:
  contents: read
jobs:
  database-and-browser-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
