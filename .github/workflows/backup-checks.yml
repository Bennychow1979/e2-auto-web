name: Verify encrypted backup and restore
on:
  pull_request:
    paths: ['scripts/backup/**', 'scripts/notify-backup.mjs', '.github/workflows/backup*.yml']
  push:
    branches: [main]
    paths: ['scripts/backup/**', 'scripts/notify-backup.mjs', '.github/workflows/backup*.yml']
permissions:
  contents: read
jobs:
  synthetic-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      source:
        image: postgres:18
        env:
          POSTGRES_USER: e2_source
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: source
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2_source -d source"
          --health-interval 5s --health-timeout 5s --health-retries 12
      restore:
        image: postgres:18
        env:
          POSTGRES_USER: e2_restore
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: restore
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U e2_restore -d restore"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clients
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18 gnupg
          python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.9'
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Restore synthetic database and check storage, scheduling and failures
        env:
          BACKUP_INTEGRATION: '1'
        run: |
          python -m unittest discover -s scripts/backup -p 'test_*.py' -v
          node --check scripts/notify-backup.mjs
      # Synthetic inputs only; no production secrets, artifact or cache uploads.
