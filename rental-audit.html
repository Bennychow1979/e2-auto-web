<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>租车操作记录 · E2 Auto</title><link rel="stylesheet" href="rental-audit.css?v=return-nav-1"></head>
<body>
<header><div class="shell top"><nav class="returnNav" aria-label="返回工作台"><a href="rental.html">← 租车月供</a><a href="dashboard.html">返回 Dashboard</a><a href="portal.html?view=inventory">返回车辆管理 ↗</a></nav><span> E2 AUTO · SUPER ADMIN</span><button id="signOut" hidden>退出</button></div></header>
<main class="shell">
<h1>租车操作记录</h1><p class="subtitle">Rental activity log · 谁操作、何时操作，以及资料的前后变化。</p>
<section id="gate" class="card" role="status"><p id="gateMessage">正在验证 Super Admin 权限…</p><a href="rental.html">员工登录 / 返回租车页</a></section>
<section id="content" hidden>
<form id="filters" class="card filters"><label for="plate">车牌 / Plate<input id="plate" maxlength="60" placeholder="输入完整或部分车牌" autocomplete="off"></label><button type="submit">搜索</button><button type="button" id="refresh">刷新最新记录</button></form>
<p class="note">时间为马来西亚时间（MYT）。操作人显示账号邮箱；系统／导入记录可能没有员工账号。这里只能查看，不能修改或删除记录。</p>
<p id="status" role="status" aria-live="polite"></p><div id="records"></div>
<nav class="pagination" aria-label="操作记录分页"><button id="previous">上一页</button><button id="next">下一页</button></nav>
</section>
<dialog id="detail" aria-labelledby="detailTitle"><div class="dialogHead"><h2 id="detailTitle">修改前后</h2><button id="closeDetail" aria-label="关闭对比">关闭 ×</button></div><p id="detailMeta"></p><p class="note">仅列出有变化的字段；“未设置”与空值、0、否分别显示。数组按项目顺序对比。</p><div id="changes"></div></dialog>
</main><script src="e2-config.js"></script><script type="module" src="rental-audit.js?v=1"></script>
</body></html>
