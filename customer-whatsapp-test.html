<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>WhatsApp sign-in test | E2 Auto</title><link rel="stylesheet" href="customer.css?v=customer-1"><script src="e2-config.js"></script><script type="module" src="customer-whatsapp-test.mjs?v=pilot-1"></script></head>
<body><header class="customerNav"><a class="brand" href="/"><img src="assets/e2-logo.png" alt="E2 Auto"><strong>E2 AUTO</strong></a><nav aria-label="Language"><a href="?lang=ms">BM</a> · <a href="?lang=en">EN</a> · <a href="?lang=zh">华语</a></nav></header>
<main class="customerShell"><section class="customerIntro"><span class="eyebrow">MY E2 · TEST</span><h1 data-copy="title">Sign in with WhatsApp</h1><p data-copy="intro">Limited test. Email sign-in remains available.</p><a id="emailLink" href="customer.html" data-copy="email">Use email instead</a></section>
<section class="accountCard"><div class="authTabs"><button id="otpLogin" disabled type="button" aria-pressed="true" data-copy="login">Sign in</button><button id="otpRegister" disabled type="button" aria-pressed="false" data-copy="register">Create account</button></div>
<form id="otpRequest"><label><span data-copy="phone">WhatsApp number</span><input name="phone" type="tel" autocomplete="tel" required maxlength="24" placeholder="012 345 6789"></label><div id="otpRegistration" hidden><label><span data-copy="name">Full name</span><input name="full_name" autocomplete="name" maxlength="100"></label><label class="check"><input name="privacy" type="checkbox"><span><span data-copy="consent">I agree to the customer privacy notice.</span> <a id="privacyLink" href="customer-privacy.html" target="_blank" rel="noopener" data-copy="privacy">Read notice</a></span></label></div><p data-copy="existing">Already registered by email? Use email to access your existing saved cars. Accounts are not automatically merged by phone number.</p><button class="primary" data-copy="request" type="submit" disabled>Send verification code</button></form>
<form id="otpVerify" hidden><p id="otpDestination"></p><label><span data-copy="code">6-digit code</span><input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><button class="primary" data-copy="verify" type="submit">Verify and continue</button><button type="button" id="otpChange" data-copy="change">Change number / resend</button></form>
<p id="otpStatus" role="status" aria-live="polite"></p><section id="otpSignedIn" hidden><p data-copy="signed">You are signed in.</p><a id="profileLink" href="customer.html" data-copy="profile">My profile</a> · <a id="savedLink" href="saved.html" data-copy="saved">Saved cars</a><button id="otpSignOut" data-copy="signout">Sign out</button></section></section></main></body></html>
