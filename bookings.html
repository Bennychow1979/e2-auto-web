<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Viewing requests — E2 Workspace</title><link rel="icon" href="assets/e2-logo.png"><link rel="stylesheet" href="partner.css"><link rel="stylesheet" href="bookings.css?v=1"><script src="e2-config.js"></script><script type="module" src="bookings.js?v=1"></script></head><body>
<header><a href="portal.html">E2 WORKSPACE</a><nav><a href="portal.html">Vehicles</a><a href="bookings.html" aria-current="page">Viewing requests</a><a href="referrals.html">Partners &amp; referrals</a><a href="booking.html" target="_blank" rel="noopener">Public booking page ↗</a></nav></header>
<main><p class="eyebrow">CUSTOMER VISITS · MALAYSIA TIME</p><h1>Viewing requests.</h1><p>Contact the customer, agree a time, then confirm the appointment here. Saving does not send a message.</p><p id="message" role="status" aria-live="polite">Checking staff access…</p><section id="workspace" hidden><div class="bookingTools"><label>Status<select id="statusFilter"><option value="open">Open requests</option><option value="all">All statuses</option><option>Requested</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></label><label>Search<input id="bookingSearch" type="search" placeholder="Name, phone, car or reference"></label><button id="refresh" type="button">Refresh</button></div><p id="bookingCount"></p><div id="bookingList"></div></section></main>
<dialog id="bookingEditor" aria-labelledby="editorTitle"><form id="editForm"><div class="editorHeading"><h2 id="editorTitle">Manage viewing</h2><button type="button" id="closeEditor" class="secondary" aria-label="Close viewing">×</button></div><p id="customerDetails"></p><p><a id="callCustomer">Call customer</a></p><p id="requestDetails" class="requestDetails"></p><label>Status<select name="status" id="editStatus"></select></label><label>Assigned salesperson<select name="sales" id="editSales"></select></label><div id="confirmationFields"><label>Agreed date<input type="date" id="confirmedDate" name="day"></label><label>Agreed time (Malaysia time)<select name="time" id="confirmedTime"></select></label><label class="checkLabel"><input type="checkbox" name="contact" id="confirmedContact"> I have contacted the customer and they agreed to this date and time.</label></div><label>Internal note<textarea name="note" id="staffNote" maxlength="1000" rows="3" placeholder="Arrangement or cancellation reason. No identity documents or financial details."></textarea></label><p id="editMessage" role="status"></p><button id="saveBooking">Save appointment</button></form></dialog>
</body></html>
